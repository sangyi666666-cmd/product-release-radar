version: 1
timezone: Asia/Shanghai

lanes:
  - agent_platform
  - ai_worker
  - data_agent
  - work_agent
  - agentic_coding
  - foundation_model
  - ai_platform
  - ai_infrastructure
  - capital
  - enterprise_case
  - research

source_tiers:
  P0: official_or_primary
  P1: community_or_discovery
  P2: media_or_analysis

scoring:
  relevance: 25
  impact: 25
  evidence_quality: 20
  novelty: 15
  actionability: 15
  thresholds:
    top_signal: 80
    important: 60
    watch: 40

agent_infra_model_release:
  dimensions:
    - tool_and_async_calling
    - context_memory_and_long_tasks
    - coding_browsing_and_computer_use
    - latency_throughput_and_cost
    - deployment_access_security_and_governance
  top_signal_candidate_when_dimensions_changed: 2
  require_official_release_source: true

publishing:
  branch: main
  canonical_format: markdown
  issue_mirror: true
  skip_empty_report: true
  require_primary_source_for_top_signal: true
